<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Velocita Global | Login</title>
<link rel="icon" href="/img/logo.webp" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#F4821F" />
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Velocita" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700;800&display=swap">
<style>
@keyframes lgUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes lgPop{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}
.login-card{animation:lgUp .6s ease-out both}
.login-card img{animation:lgPop .8s .15s cubic-bezier(.2,.9,.3,1.2) both}
.login-card h1{font-family:'Poppins',sans-serif;animation:lgUp .6s .25s ease-out both}
.login-card .subtitle,.login-card .login-field,.login-card .login-btn{animation:lgUp .6s .35s ease-out both}
@media (prefers-reduced-motion:reduce){.login-card,.login-card *{animation:none!important}}
</style>
</head>
<body>
  <div class="login-shell">
    <form class="login-card" id="login-form">
      <img src="/img/logo.webp" alt="Velocita Global" />
      <h1>Velocita Global</h1>
      <p class="subtitle">Entre com o seu usuário e senha</p>

      <div class="login-error" id="login-error">Usuário ou senha incorretos. Tente novamente.</div>

      <div class="login-field">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" placeholder="Seu usuário" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus />
      </div>
      <div class="login-field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="Sua senha" autocomplete="current-password" />
      </div>

      <button type="submit" class="login-btn">Entrar</button>
    </form>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
