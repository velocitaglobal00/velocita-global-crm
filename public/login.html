<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Velocita Global | Login</title>
<link rel="icon" href="/img/logo.webp" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-shell">
    <form class="login-card" id="login-form">
      <img src="/img/logo.webp" alt="Velocita Global" />
      <h1>Velocita Global</h1>
      <p class="subtitle">Acesse seu CRM comercial</p>

      <div class="login-error" id="login-error">Senha incorreta. Tente novamente.</div>

      <div class="login-field">
        <label for="password">Senha de acesso</label>
        <input type="password" id="password" name="password" placeholder="Digite a senha" autocomplete="current-password" autofocus />
      </div>

      <button type="submit" class="login-btn">Entrar</button>
    </form>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
